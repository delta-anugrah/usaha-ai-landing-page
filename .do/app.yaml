# DigitalOcean App Platform spec. The GitHub Actions workflow
# (.github/workflows/deploy-digitalocean.yml) creates or updates the app from this file.
name: usaha-ai-landing-page
region: sgp
domains:
  - domain: usaha.ai
    type: PRIMARY
  - domain: www.usaha.ai
    type: ALIAS
static_sites:
  - name: web
    git:
      # Public repo, cloned directly: no DigitalOcean GitHub app needed on the org.
      repo_clone_url: https://github.com/delta-anugrah/usaha-ai-landing-page.git
      branch: staging
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: out
    error_document: 404.html
